name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 実地図タイル表示には geolonia.github.io を許可した Geolonia Maps キーが要る。
          # リポジトリ変数 GEOLONIA_API_KEY を設定すれば実キーで配信、未設定なら
          # プレースホルダ(施設ピンは描画されるがベース地図タイルは表示されない)。
          VITE_GEOLONIA_API_KEY: ${{ vars.GEOLONIA_API_KEY || 'YOUR-API-KEY' }}
          VITE_DEMO_MODE: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_GEONICDB_URL: ${{ vars.GEONICDB_URL || 'https://geonicdb.geolonia.com' }}
          VITE_GEONICDB_TENANT: ${{ vars.GEONICDB_TENANT || 'demo' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
