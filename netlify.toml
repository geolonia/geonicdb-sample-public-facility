[build]
  command = "npm run build"
  publish = "dist"

# 以下はフォーク直後でもビルドが通るためのプレースホルダー既定値です。
# 実際の地図タイル表示・自GeonicDBへの接続には、Netlify サイトの
# Site configuration > Environment variables で上書きしてください。
[build.environment]
  VITE_GEONICDB_URL = "https://geonicdb.geolonia.com"
  VITE_GEONICDB_TENANT = "demo"
  VITE_GEOLONIA_API_KEY = "YOUR-API-KEY"
  VITE_DEMO_MODE = "true"

# SPA なのでどのパスへの直接アクセスも index.html を返す
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
